<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학원 학생관리 대시보드 (강사용)</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>학생관리 대시보드</h1>
    <div class="header-actions">
      <button class="btn btn-ghost" id="backup-btn">백업 내려받기</button>
      <button class="btn btn-ghost" id="restore-btn">백업 복원</button>
      <input type="file" id="restore-input" accept=".json" hidden />
    </div>
  </header>

  <div id="save-status" class="save-status" hidden></div>

  <div id="semester-bar" class="semester-bar"></div>
  <nav id="class-tabs" class="class-tabs"></nav>
  <nav id="sub-tabs" class="subtab-nav"></nav>

  <main id="content" class="content">
    <div class="empty-state">불러오는 중...</div>
  </main>

  <footer class="app-footer">
    데이터는 이 폴더 안의 data/store.json 파일에 저장됩니다. 폴더째로 복사하거나 OneDrive/구글드라이브 같은 동기화 폴더에 넣으면 다른 컴퓨터에서도 같은 데이터로 열 수 있습니다.
    ('시작하기.bat'으로 실행 중이어야 저장됩니다.)
  </footer>

  <script src="js/store.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
